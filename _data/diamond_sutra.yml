- id: 第一品
  note: "开篇先写佛陀穿衣、托钵、乞食、用餐、洗足、安坐，没有先讲玄妙道理。它把修行放回普通生活：吃饭时吃饭，做事时做事，照料眼前的人和事，也是一种练习。"
- id: 第二品
  note: "须菩提问：发起觉悟之心以后，心该安住在哪里，又怎样安顿纷乱的念头？这不是要求把念头压下去，而是追问人怎样不被念头和情绪牵着走。全经后面一再回到这个问题。"
- id: 第三品
  note: "菩萨发愿帮助一切众生，却不把自己想成高高在上的救助者，也不把别人固定成等待被救的人。直白地说，可以真心去帮助别人，同时少一点‘是我救了他’的自我经营；愿心很大，行动仍然落在具体事情上。"
- id: 第四品
  note: "这里把布施和‘无住’连在一起：给予时，不只不贪着财物，也不把名声、赞美和回报当成交换条件。无住不是不行动，也不是不判断该怎样帮助，而是做完以后少一点反复抓取功劳与结果。"
- id: 第五品
  note: "佛不能被某一种外貌或可见形象完全代表。‘凡所有相，皆是虚妄’不是说眼前一切都不存在，而是提醒我们：形象会变化、依条件形成，不要把眼前的样子误当成永恒不变的本体。"
- id: 第六品
  note: "本品谈对般若智慧生起信心，也提醒人不要把‘相信’变成新的执着。筏子的比喻可以这样理解：教法帮助人走过一段路，但不必把教法变成身份或争论的工具；连‘我什么都不信’也可能成为另一种执着。"
- id: 第七品
  note: "须菩提回答说，没有一个固定的法可以被如来取得或说尽。这不是说佛没有开示，而是说语言和概念能指路，却不能被当作一件已经占有的真理；听见道理之后，还要回到观察与实践。"
- id: 第八品
  note: "经文把大量珍宝布施与受持、理解、讲说经义作比较，重点不是说物质帮助不重要，而是指出智慧可以改变人认识痛苦和执着的方式。‘佛法即非佛法’也在提醒：佛法这个名称是指引，不是可以拿来夸耀或占有的东西。"
- id: 第九品
  note: "须陀洹、斯陀含、阿那含、阿罗汉等果位，不能变成‘我已经修到哪里’的身份牌。经文借这些层次说明，修行若不断强化一个自我形象，就偏离了它要照见的执着；进步不必靠名号来证明。"
- id: 第十品
  note: "‘庄严佛土’不只是把环境装点得漂亮，也关乎以清净、不执着的心去做利益众生的事。‘应无所住而生其心’可以直白地理解为：不用先抓住回报或对象，仍可以生起善意、认真行动，并根据实际情况调整做法。"
- id: 第十一品
  note: "恒河沙数的譬喻把布施的数量推到极大，用来说明智慧的价值不能只按物品多少计算。它不是叫人停止给予，而是让人看见：物质帮助能解一时之困，清明的理解也可能影响一个人之后怎样面对生活。"
- id: 第十二品
  note: "经文所在之处受到尊重，指向对其中智慧的珍惜，也提醒人认真听闻、读诵和传讲。若只剩下对书本或仪式的敬重，却没有把觉察、离执与善意带回日常待人接物，就还没有走到读经的用处上。"
- id: 第十三品
  note: "佛为经命名，又反复说名称并非固定的实体；微尘、世界、身体形相也都由许多条件聚合而成。名称方便我们沟通，却不是事物永远不变的本质；使用概念可以，别把概念当成事情本身。"
- id: 第十四品
  note: "须菩提听闻后深受触动，显示般若并非冷冰冰的概念。离相不是压抑情绪、否定他人或纵容伤害；它是看见‘我’与‘他’都不是永远固定的身份，因此可以少些被自我评价绑住，同时更清醒地慈悲行事。"
- id: 第十五品
  note: "本品反复赞叹受持、读诵和为人解说，强调智慧需要持续学习，也需要传递给别人。经文中的功德不必被读成可以累积、兑换的分数；更实际的检验，是读过之后是否更能看清自己的执着，并在行为上有所改变。"
- id: 第十六品
  note: "本品用受持经文与遭人轻贱、业力和修行相连，这是经文本身的宗教表达，不应拿来责怪受害者、替不公找理由，或要求人忍受伤害。现实中仍可以求助、设立边界、制止伤害；阅读时可以同时观察自己的反应与选择。"
- id: 第十七品
  note: "全经再次回到‘怎样安住、降伏其心’，并把帮助众生的愿心和无我放在一起。发愿去做有益的事，不等于要把自己塑造成救世主；行动可以真实发生，却不必执着于‘我度了谁’的固定身份。"
- id: 第十八品
  note: "五眼呈现不同层次的观察能力，接着经文说过去心、现在心、未来心都不可得。可以把它理解为：念头一直在变化，没有哪一个瞬间足以代表完整、永恒的我；这不是否认经历，而是提醒人别被一时的情绪和想法定死。"
- id: 第十九品
  note: "布施会带来善的影响，但若把福德当成一份永远归自己所有的资产，就又落入占有。‘福德无故’提醒人善行依因缘而起，也会在关系和行动中产生影响；可以认真行善，不必把它做成交换回报的账本。"
- id: 第二十品
  note: "即使外在形象具足，也不能单靠形貌认定如来。看见美好的形象可以生起敬意，但形象本身并不等于觉悟；还要看见它所指向的智慧，并落实到自己的理解、选择和待人方式里。"
- id: 第二十一品
  note: "佛确实说了许多法，这里所说‘无法可说’，不是要否定经文，而是提醒人不要把教法误当成一套可以占有、争胜的固定概念。说法是引导，听法也要继续体会；不能只停在字面上。"
- id: 第二十二品
  note: "佛说没有少法可得，指向觉悟不是得到一件新东西、一个头衔或某种可以炫耀的境界。学习和练习仍然重要，只是不用时时追问‘我拿到了什么’，可以把注意力放回当下的观察与行动。"
- id: 第二十三品
  note: "‘法平等、无有高下’并不是说所有行为都没有差别，而是说觉悟不由身份和阶层授予。经文仍然强调修一切善法；只是行善时少一点自我标榜，不把善行变成证明自己比别人高明的凭据。"
- id: 第二十四品
  note: "本品继续比较珍宝布施与般若智慧，突出智慧能改变人理解世界和处理问题的方式。这并不贬低眼前的实际帮助：给予可以继续做，同时也学习看清自己的动机、对结果的执着，以及帮助之后的责任。"
- id: 第二十五品
  note: "如来利益众生，却不把众生当成自己的所有物，也不把自己塑造成唯一的救世者。‘凡夫’等名称只是方便指称，不是给人贴上永远改不了的标签；帮助别人时，既要行动，也要尊重对方的处境和主体性。"
- id: 第二十六品
  note: "三十二相是外在形貌，不能单凭这些特征认定如来；偈子也提醒人不要只靠形色和声音追寻佛。它不是否认身体与形象，而是提醒我们别把可见的符号和它所指向的觉悟混为一谈。"
- id: 第二十七品
  note: "不执着形象，绝不是说一切都不存在，也不是否定因果、伦理和众生。经文特别防止把‘空’误读成断灭或‘什么都无所谓’；发起觉悟之心的人仍要认真修善、承担行动带来的责任。"
- id: 第二十八品
  note: "‘不受福德’不是拒绝善果或停止行善，而是不贪着、不把功德据为己有。可以尽力做好一件事，也可以让善行完成后不反复计算自己应得多少回报；心不被奖赏绑住，行动反而更自在。"
- id: 第二十九品
  note: "‘无所从来，亦无所去’是在说如来不能被简化成某个来去、坐卧的外相或地点。它不是否认人的身体会移动，而是把注意力从表面的动作引向更深的如实观察；不要只凭外在表现下判断。"
- id: 第三十品
  note: "微尘聚成世界，许多部分又被我们称作一个整体；‘一合相’是帮助沟通的名称，不代表有一个独立、恒常、可以牢牢抓住的整体。看清事物由条件组合而成，能帮助我们少把暂时的状态误当成永远如此。"
- id: 第三十一品
  note: "经文谈我见、人见、众生见、寿者见，也提醒人不要把‘无我’和‘空’变成新的教条。若拿这些词压住别人的感受、否定现实问题，或证明自己更高明，就仍是在抓住一个观念不放。"
- id: 第三十二品
  note: "梦、幻、泡、影、露、电的比喻，提醒人世间许多事物短暂并依条件而生。看见无常不是消极放弃，而是在知道结果不由自己完全掌控时，仍然真诚待人、认真行动，同时少被对结果的执取困住。"
